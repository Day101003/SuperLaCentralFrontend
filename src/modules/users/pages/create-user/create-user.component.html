<!-- Header Section -->
<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a [routerLink]="['/dashboard']" class="hover:text-primary transition-colors">Dashboard</a>
    <i data-feather="chevron-right" class="w-4 h-4"></i>
    <a [routerLink]="['/users']" class="hover:text-primary transition-colors">Usuarios</a>
    <i data-feather="chevron-right" class="w-4 h-4"></i>
    <span class="text-gray-900 font-medium">Crear Usuario</span>
  </div>
  
  <div class="flex items-end justify-between">
    <div>
      <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Usuarios</p>
      <h1 class="text-4xl font-bold text-gray-900">Crear Nuevo Usuario</h1>
    </div>
   
  </div>
</div>

<!-- Main Content -->
<div class="max-w-5xl mx-auto">
  <!-- Alerts -->
  @if (errorMessage) {
    <div class="mb-6 bg-red-50 border-l-4 border-red-500 rounded-lg p-4 flex items-start gap-3">
      <i data-feather="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></i>
      <div class="flex-1">
        <p class="text-red-800 font-medium">{{ errorMessage }}</p>
      </div>
      <button (click)="errorMessage = ''" class="text-red-500 hover:text-red-700">
        <i data-feather="x" class="w-5 h-5"></i>
      </button>
    </div>
  }

  @if (successMessage) {
    <div class="mb-6 bg-emerald-50 border-l-4 border-emerald-500 rounded-lg p-4 flex items-start gap-3">
      <i data-feather="check-circle" class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5"></i>
      <div class="flex-1">
        <p class="text-emerald-800 font-medium">{{ successMessage }}</p>
      </div>
    </div>
  }

  <!-- User Form Component -->
  <app-user-form
    mode="create"
    [loading]="loading"
    [errorMessage]="errorMessage"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()">
  </app-user-form>
</div>
