<!-- Header Section -->
<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a [routerLink]="['/dashboard']" class="hover:text-primary transition-colors">Dashboard</a>
    <i data-feather="chevron-right" class="w-4 h-4"></i>
    <a [routerLink]="['/customers']" class="hover:text-primary transition-colors">Clientes</a>
    <i data-feather="chevron-right" class="w-4 h-4"></i>
    <span class="text-gray-900 font-medium">Editar Cliente</span>
  </div>

  <div class="flex items-end justify-between">
    <div>
      <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Clientes</p>
      <h1 class="text-4xl font-bold text-gray-900">Editar Cliente</h1>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="max-w-5xl mx-auto">
  <!-- Alerts -->
  <ng-container *ngIf="errorMessage">
    <div class="mb-6 bg-red-50 border-l-4 border-red-500 rounded-lg p-4 flex items-start gap-3">
      <i data-feather="alert-circle" class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></i>
      <div class="flex-1">
        <p class="text-red-800 font-medium">{{ errorMessage }}</p>
      </div>
      <button (click)="errorMessage = ''" class="text-red-500 hover:text-red-700">
        <i data-feather="x" class="w-5 h-5"></i>
      </button>
    </div>
  </ng-container>

  <ng-container *ngIf="successMessage">
    <div class="mb-6 bg-emerald-50 border-l-4 border-emerald-500 rounded-lg p-4 flex items-start gap-3">
      <i data-feather="check-circle" class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5"></i>
      <div class="flex-1">
        <p class="text-emerald-800 font-medium">{{ successMessage }}</p>
      </div>
    </div>
  </ng-container>

  <!-- Loading State -->
  <ng-container *ngIf="loading && !customerData">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-12">
      <div class="flex flex-col items-center justify-center">
        <svg class="animate-spin h-12 w-12 text-primary mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-600">Cargando información del cliente...</p>
      </div>
    </div>
  </ng-container>

  <!-- Customer Form Component -->
  <app-customer-form *ngIf="customerData"
    mode="edit"
    [customerData]="customerData"
    [loading]="loading"
    [errorMessage]="errorMessage"
    (formSubmit)="onFormSubmit($event)"
    (formCancel)="onFormCancel()">
  </app-customer-form>
</div>
