<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a routerLink="/dashboard" class="hover:text-primary transition-colors">Dashboard</a><span>›</span>
    <a routerLink="/inventory/categories" class="hover:text-primary transition-colors">Categorías</a><span>›</span>
    <span class="text-gray-900 font-medium">Editar Categoría</span>
  </div>
  <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Inventario</p>
  <h1 class="text-4xl font-bold text-gray-900">Editar Categoría</h1>
</div>
<div class="max-w-5xl mx-auto">
  @if (loading) {
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
      <p class="mt-4 text-gray-600">Cargando información de la categoría...</p>
    </div>
  } @else if (category) {
    <app-category-form mode="edit" [categoryData]="category" [loading]="saving" (formSubmit)="submit($event)" (formCancel)="cancel()"></app-category-form>
  }
</div>
