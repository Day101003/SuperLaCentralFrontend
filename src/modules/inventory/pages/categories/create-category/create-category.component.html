<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a routerLink="/dashboard" class="hover:text-primary transition-colors">Dashboard</a><span>›</span>
    <a routerLink="/inventory/categories" class="hover:text-primary transition-colors">Categorías</a><span>›</span>
    <span class="text-gray-900 font-medium">Crear Categoría</span>
  </div>
  <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Inventario</p>
  <h1 class="text-4xl font-bold text-gray-900">Crear Categoría</h1>
</div>
<div class="max-w-5xl mx-auto">
  <app-category-form mode="create" [loading]="loading" (formSubmit)="submit($event)" (formCancel)="cancel()"></app-category-form>
</div>
