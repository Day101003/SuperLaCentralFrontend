<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a routerLink="/dashboard">Dashboard</a><span>›</span
    ><a routerLink="/inventory/orders">Órdenes</a><span>›</span
    ><span class="text-gray-900">Editar Orden</span>
  </div>
  <p class="text-sm text-gray-500 uppercase tracking-wider">Gestión de Inventario</p>
  <h1 class="text-4xl font-bold">Editar Orden</h1>
</div>
<div class="max-w-5xl mx-auto">
  @if (loading) {
    <div class="bg-white rounded-xl p-12 text-center">Cargando orden...</div>
  } @else if (order()) {
    <app-order-form
      mode="edit"
      [orderData]="order()"
      [orderDetails]="details()"
      [products]="products()"
      [loading]="saving"
      (formSubmit)="submit($event)"
      (formCancel)="cancel()"
    ></app-order-form>
  }
</div>
