<div class="mb-8">
  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a routerLink="/dashboard" class="hover:text-primary">Dashboard</a><span>›</span
    ><a routerLink="/inventory/promotions" class="hover:text-primary">Promociones</a><span>›</span
    ><span class="text-gray-900 font-medium">Editar Promoción</span>
  </div>
  <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Inventario</p>
  <h1 class="text-4xl font-bold text-gray-900">Editar Promoción</h1>
</div>
<div class="max-w-5xl mx-auto">
  @if (loading) {
    <div class="bg-white rounded-xl p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
      <p class="mt-4">Cargando promoción...</p>
    </div>
  } @else if (promotion()) {
    <app-promotion-form
      mode="edit"
      [promotionData]="promotion()"
      [products]="products()"
      [loading]="saving"
      (formSubmit)="submit($event)"
      (formCancel)="cancel()"
    ></app-promotion-form>
  }
</div>
