<div class="mb-8">
  <div class="flex items-end justify-between">
    <div>
      <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">Gestión de Inventario</p>
      <h1 class="text-4xl font-bold text-gray-900">Promociones</h1>
    </div>
    <button
      (click)="createPromotion()"
      class="px-4 py-2 bg-primary hover:bg-primary-700 text-white rounded-lg flex items-center gap-2"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line></svg
      >Crear Nueva Promoción
    </button>
  </div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 max-w-5xl">
  <div class="bg-white rounded-xl border p-4">
    <div class="flex justify-between mb-2">
      <div class="bg-blue-50 p-2 rounded-lg">
        <svg
          class="w-5 h-5 text-primary"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path
            d="M20.59 13.41 11 3.83V3H4v7h.83l9.58 9.59a2 2 0 0 0 2.82 0l3.36-3.36a2 2 0 0 0 0-2.82z"
          ></path>
          <circle cx="7" cy="6" r="1"></circle>
        </svg>
      </div>
      <span class="text-xl font-bold">{{ promotions().length }}</span>
    </div>
    <p class="text-sm text-gray-600">Total Promociones</p>
  </div>
  <div class="bg-white rounded-xl border p-4">
    <div class="flex justify-between mb-2">
      <div class="bg-emerald-50 p-2 rounded-lg">
        <svg
          class="w-5 h-5 text-emerald-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m8 12 2.5 2.5L16 9"></path>
        </svg>
      </div>
      <span class="text-xl font-bold">{{ activeCount() }}</span>
    </div>
    <p class="text-sm text-gray-600">Promociones Activas</p>
  </div>
  <div class="bg-white rounded-xl border p-4">
    <div class="flex justify-between mb-2">
      <div class="bg-yellow-50 p-2 rounded-lg">
        <svg
          class="w-5 h-5 text-yellow-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
      </div>
      <span class="text-xl font-bold">{{ expiringSoonCount() }}</span>
    </div>
    <p class="text-sm text-gray-600">Vencen en 7 días</p>
  </div>
</div>
@if (loading()) {
  <div class="bg-white rounded-xl p-12 text-center">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
    <p class="mt-4 text-gray-600">Cargando promociones...</p>
  </div>
} @else if (error()) {
  <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-red-600">{{ error() }}</div>
} @else {
  <app-data-table
    [columns]="tableColumns"
    [data]="pagination.paginatedItems()"
    [actions]="tableActions"
    [showSearch]="true"
    [showFooter]="true"
    [trackBy]="'id_promotion'"
    [startRecord]="pagination.startRecord()"
    [endRecord]="pagination.endRecord()"
    [totalRecords]="pagination.totalItems()"
    (search)="onSearch($event)"
    emptyMessage="No se encontraron promociones"
    ><app-pagination
      slot="pagination"
      [currentPage]="pagination.currentPage()"
      [totalPages]="pagination.totalPages()"
      (pageChange)="onPageChange($event)"
    ></app-pagination
  ></app-data-table>
}
