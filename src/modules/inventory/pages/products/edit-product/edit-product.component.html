  <div class="flex items-center gap-3 text-sm text-gray-500 mb-4">
    <a routerLink="/dashboard" class="hover:text-primary">Dashboard</a><span>â€º</span
    ><a routerLink="/inventory/products" class="hover:text-primary">Productos</a><span>â€º</span
    ><span class="text-gray-900 font-medium">Editar Producto</span>
  </div>
  <p class="text-sm text-gray-500 uppercase tracking-wider mb-1">GestiÃ³n de Inventario</p>

<div class="max-w-5xl mx-auto">
  @if (loading) {
    <div class="bg-white rounded-2xl shadow-lg border p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
      <p class="mt-4 text-gray-600">Cargando producto...</p>
    </div>
  } @else if (product()) {
    <app-product-form
      mode="edit"
      [productData]="product()"
      [categories]="categories()"
      [suppliers]="suppliers()"
      [selectedSupplierIds]="selectedSupplierIds"
      [loading]="saving"
      (formSubmit)="onSubmit($event)"
      (formCancel)="onCancel()"
    ></app-product-form>
  }
</div>
