<div class="mb-8">
  <p class="text-sm text-gray-500 uppercase mb-1">Gestión de Inventario</p>
  <h1 class="text-4xl font-bold">Editar Proveedor</h1>
</div>
<div class="max-w-5xl mx-auto">
  @if (loading) {
    <div class="bg-white rounded-xl p-12 text-center">Cargando proveedor...</div>
  } @else if (supplier) {
    <app-supplier-form
      mode="edit"
      [supplierData]="supplier"
      [loading]="saving"
      (formSubmit)="submit($event)"
      (formCancel)="cancel()"
    />
  }
</div>
