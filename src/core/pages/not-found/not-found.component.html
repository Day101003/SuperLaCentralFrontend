<div class="min-h-screen bg-gradient-to-br from-primary via-primary-700 to-primary-900 flex flex-col relative overflow-hidden">
  <!-- Decorative Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-secondary opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-secondary opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary opacity-5 rounded-full blur-3xl"></div>
  </div>

  <!-- Content -->
  <div class="flex-1 flex items-center justify-center px-4 relative z-10">
    <main class="w-full max-w-3xl">
      <div class="text-center">
        <!-- 404 Number with Shopping Cart -->
        <div class="relative mb-8">
          <div class="flex items-center justify-center gap-4">
            <span class="text-9xl font-black text-white opacity-90">4</span>
            <div class="relative">
              <!-- Shopping Cart Icon -->
              <div class="w-32 h-32 bg-secondary rounded-full flex items-center justify-center shadow-2xl animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
              </div>
              <!-- Decorative Ring -->
              <div class="absolute inset-0 w-32 h-32 border-4 border-secondary opacity-30 rounded-full animate-ping"></div>
            </div>
            <span class="text-9xl font-black text-white opacity-90">4</span>
          </div>
        </div>

        <!-- Title -->
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
          ¡Página no encontrada!
        </h1>
        
        <!-- Subtitle -->
        <p class="text-xl text-secondary mb-8 max-w-2xl mx-auto">
          Parece que este producto no está en nuestro inventario. 
          La página que buscas no existe o fue movida a otro pasillo.
        </p>

        <!-- Decorative Line -->
        <div class="flex items-center justify-center gap-4 mb-10">
          <div class="h-px w-20 bg-secondary bg-opacity-30"></div>
          <i data-feather="shopping-bag" class="w-5 h-5 text-secondary"></i>
          <div class="h-px w-20 bg-secondary bg-opacity-30"></div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
          <a
            routerLink="/"
            class="inline-flex items-center gap-2 px-8 py-4 bg-secondary hover:bg-secondary-600 text-primary font-bold rounded-xl transition-all transform hover:scale-105 shadow-xl hover:shadow-2xl"
          >
            <i data-feather="home" class="w-5 h-5"></i>
            Ir al Inicio
          </a>
          
          <button
            onclick="history.back()"
            class="inline-flex items-center gap-2 px-8 py-4 bg-white bg-opacity-10 hover:bg-opacity-20 text-white font-semibold rounded-xl transition-all border-2 border-white border-opacity-20"
          >
            <i data-feather="arrow-left" class="w-5 h-5"></i>
            Volver Atrás
          </button>
        </div>

        <!-- Helpful Links -->
        <div class="mt-12 pt-8 border-t border-white border-opacity-10">
          <p class="text-secondary text-sm mb-4 font-medium">Enlaces útiles:</p>
          <div class="flex flex-wrap justify-center gap-6">
            <a routerLink="/inventario" class="text-white hover:text-secondary transition-colors text-sm font-medium flex items-center gap-2">
              <i data-feather="package" class="w-4 h-4"></i>
              Inventario
            </a>
            <a routerLink="/compras" class="text-white hover:text-secondary transition-colors text-sm font-medium flex items-center gap-2">
              <i data-feather="shopping-cart" class="w-4 h-4"></i>
              Compras
            </a>
            <a routerLink="/empleados" class="text-white hover:text-secondary transition-colors text-sm font-medium flex items-center gap-2">
              <i data-feather="users" class="w-4 h-4"></i>
              Empleados
            </a>
            <a routerLink="/reportes" class="text-white hover:text-secondary transition-colors text-sm font-medium flex items-center gap-2">
              <i data-feather="bar-chart-2" class="w-4 h-4"></i>
              Reportes
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Footer -->
  <div class="relative z-10 text-center py-6 text-secondary text-sm">
    <p>© 2025 La Central Supermercado - Sistema de Administración</p>
  </div>
</div>
